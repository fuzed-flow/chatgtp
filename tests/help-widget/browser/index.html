<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Help mobile preview</title>
<style>body{margin:0;background:#e2e8f0;color:#0f172a;font:14px system-ui}main{padding:16px}h1{font-size:20px;margin:0 0 8px}button{min-height:44px;padding:8px 16px;margin:4px;border:1px solid #cbd5e1;border-radius:8px;background:white;cursor:pointer}iframe{display:block;margin:12px 0;border:1px solid #94a3b8;border-radius:16px;background:white;max-width:100%}</style></head>
<body><main><h1>FuzedFlow AI Help — mobile preview</h1><p>Actual widget with a sample reply. No customer data or live AI requests.</p><div>
<button data-width="320" data-height="568">Small phone</button>
<button data-width="390" data-height="740">Phone</button>
<button data-width="568" data-height="320">Landscape</button>
<button data-width="900" data-height="740">Desktop</button></div>
<iframe title="Widget preview" src="./widget.html" width="390" height="740"></iframe></main>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.width=button.dataset.width;frame.height=button.dataset.height;}));</script></body></html>
